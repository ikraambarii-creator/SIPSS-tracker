const AGENDA={
 "2026-10-13":["k2","k7","k10"],"2026-10-14":["d5","d6"],"2026-10-15":["k1","k8"],"2026-10-16":["k4","k5","k6","k9","k11"],
 "2026-11-02":["d1"],"2026-11-03":["d2","d3"],"2026-11-04":["k3","d4"],"2026-11-05":["h1","h8","h9"],"2026-11-06":["h2","h4"],
 "2026-11-16":["h3"],"2026-11-17":["h5","h6","h7"],"2026-11-18":["d13"],
 "2026-12-07":["d9"],"2026-12-14":["d7"],"2026-12-19":["j8"],"2026-12-28":["h10","j7"],
 "2027-01-04":["d8"],"2027-01-05":["k12"],"2027-01-15":["d10","d12","t1"],"2027-01-16":["t2","t3","d11"],"2027-01-18":["d14"],"2027-01-20":["t4","t5"]};
const EXTRA={
 "2026-10-17":["Tes Cooper 12 menit, catat jarak di Strava"],"2026-10-22":["Jual BMX sebelum meninggalkan Tidore"],"2026-10-26":["Hari terakhir internship"],
 "2026-11-07":["Tes Cooper 12 menit, catat jarak di Strava"],"2026-11-10":["ACLS PERKI hari 1"],"2026-11-11":["ACLS PERKI hari 2"],"2026-11-12":["ACLS PERKI hari 3"],
 "2026-11-21":["Tes Cooper 12 menit, catat jarak di Strava"],"2026-11-30":["Evaluasi fase 2: dokumen & MCU sudah beres semua?"],
 "2026-12-05":["Tes Cooper 12 menit, catat jarak di Strava"],"2026-12-31":["Evaluasi fase 3: skor tryout & jasmani sudah sesuai target?"],
 "2027-01-02":["Tes Cooper 12 menit, catat jarak di Strava"]};
function routine(d){
  const w=new Date(d+"T00:00:00").getDay();
  if(d>="2026-11-09"&&d<="2026-11-13")return["Fokus ACLS; lari ringan 20 mnt bila sempat"];
  if(d>="2026-10-27"&&d<="2026-11-01")return["Masa pindahan: lari ringan 20–30 mnt bila sempat","Anki 30 mnt"];
  if(d<="2026-10-26"&&w)return["Latihan 30–45 mnt di luar jam jaga: "+WEEK[w][0].split(":")[0].toLowerCase(),"Anki TKK 30–45 mnt, sesuaikan dengan shift"];
  return WEEK[w];
}
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toLocaleDateString("sv-SE")};
const byId=Object.fromEntries(ITEMS.map(i=>[i[0],i]));
let daily={}, cur=null;
// Items ticked in this view stay in place until the view changes, so rows never jump under the finger.
const keep=new Set();

const $=id=>document.getElementById(id);
let done={}, filter="all", collapsed={};
const todayISO=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Jayapura"});
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
const pct=(a,b)=>b?Math.round(a/b*100):0;
try{collapsed=JSON.parse(localStorage.getItem("sipss-collapsed")||"{}")}catch(e){}
try{$("hideDone").checked=localStorage.getItem("sipss-hide")==="1"}catch(e){}

function renderDay(){
  const today=todayISO(); cur=cur||today;
  const ph=PHASES.find(p=>cur>=p.from&&cur<=p.to);
  const row=(id,text,on,meta)=>`<li class="item ${on?"is-done":""}"><input type="checkbox" id="dy-${id}" data-day="${id}" ${on?"checked":""}>
    <label for="dy-${id}"><span class="t">${text}</span>${meta?`<span class="meta">${meta}</span>`:""}</label></li>`;
  const late=cur===today?Object.entries(AGENDA).filter(([d])=>d<today).flatMap(([,ids])=>ids).filter(id=>!done[id]||keep.has(id)):[];
  const ag=AGENDA[cur]||[], ex=EXTRA[cur]||[], rt=routine(cur);
  const keys=[...ag.map(id=>!!done[id]),...ex.map((_,i)=>!!daily[cur+"#x"+i]),...rt.map((_,i)=>!!daily[cur+"#"+i])];
  const dn=keys.filter(Boolean).length;
  const item=id=>row("c:"+id,byId[id][3],done[id],`${byId[id][5]?'<span class="tag prio">Prioritas</span>':""}<span class="tag">${CATS[byId[id][1]]}</span>${byId[id][4]?`<span>${byId[id][4]}</span>`:""}`);
  $("day").innerHTML=`<div class="day-head">
      <h2>${new Date(cur+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}${cur===today?'<span class="pill now">Hari ini</span>':""}</h2>
      <button class="nb" data-nav="-1" aria-label="Hari sebelumnya">‹</button>
      <button class="nb" data-nav="0">Hari ini</button>
      <button class="nb" data-nav="1" aria-label="Hari berikutnya">›</button>
      <input type="date" id="dayPick" value="${cur}" aria-label="Pilih tanggal">
    </div>
    <div class="pad" style="padding-top:0">
      <div class="small muted">${ph?`Fase ${PHASES.indexOf(ph)+1}: ${ph.title}`:"Di luar rentang timeline"} · ${dn} dari ${keys.length} tugas hari ini</div>
      <div class="ph-bar"><div class="bar blue"><i style="width:${pct(dn,keys.length)}%"></i></div><span class="pct">${pct(dn,keys.length)}%</span></div>
    </div>
    <ul class="items">
      ${late.length?`<li class="grp late">Tertunda dari hari sebelumnya (${late.length})</li>${late.map(item).join("")}`:""}
      ${ag.length||ex.length?`<li class="grp">Urusan hari ini</li>${ag.map(item).join("")}${ex.map((t,i)=>row("d:"+cur+"#x"+i,t,daily[cur+"#x"+i])).join("")}`:""}
      <li class="grp">Latihan & belajar</li>${rt.map((t,i)=>row("d:"+cur+"#"+i,t,daily[cur+"#"+i])).join("")}
    </ul>`;
}

function render(){
  renderDay();
  const today=todayISO(), hide=$("hideDone").checked;
  const n=ITEMS.length, d=ITEMS.filter(i=>done[i[0]]).length;
  $("totalPct").textContent=$("navPct").textContent=pct(d,n)+"%"; $("totalBar").style.width=pct(d,n)+"%";
  $("sDone").textContent=d; $("sLeft").textContent=n-d;
  $("sPrio").textContent=ITEMS.filter(i=>i[5]&&!done[i[0]]).length;

  $("chips").innerHTML=[["all","Semua"],...Object.entries(CATS)].map(([k,v])=>
    `<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${v}</button>`).join("");

  $("phases").innerHTML=PHASES.map((p,ix)=>{
    const all=ITEMS.filter(i=>i[2]===p.id), dn=all.filter(i=>done[i[0]]).length;
    const shown=all.filter(i=>(filter==="all"||i[1]===filter)&&!(hide&&done[i[0]]&&!keep.has(i[0])));
    const complete=dn===all.length, now=today>=p.from&&today<=p.to, late=today>p.to&&!complete;
    const pill=complete?'<span class="pill ok">Selesai</span>':now?'<span class="pill now">Sekarang</span>':late?`<span class="pill late">${all.length-dn} tertinggal</span>`:"";
    return `<article class="card ${complete?"done":""} ${collapsed[p.id]?"collapsed":""}">
      <button class="phase-head" data-p="${p.id}" aria-expanded="${!collapsed[p.id]}">
        <div class="num">${ix+1}</div>
        <div class="ph-t"><b>${p.title}${pill}</b>
          <div class="small muted">${fmt(p.from)} – ${fmt(p.to)} · ${p.sub}</div>
          <div class="ph-bar"><div class="bar blue"><i style="width:${pct(dn,all.length)}%"></i></div><span class="pct">${pct(dn,all.length)}%</span></div>
          <div class="small muted">${dn} dari ${all.length} selesai</div>
        </div>
        <span class="chev" aria-hidden="true">⌄</span>
      </button>
      ${p.ev?`<div class="ev">${p.ev}</div>`:""}
      <ul class="items">${shown.map(i=>`<li class="item ${done[i[0]]?"is-done":""}">
        <input type="checkbox" id="cb-${i[0]}" data-id="${i[0]}" ${done[i[0]]?"checked":""}>
        <label for="cb-${i[0]}"><span class="t">${i[3]}</span>
          <span class="meta">${i[5]?'<span class="tag prio">Prioritas</span>':""}<span class="tag">${CATS[i[1]]}</span>${i[4]?`<span>${i[4]}</span>`:""}</span>
        </label></li>`).join("")||`<li class="empty">Tidak ada item untuk filter ini.</li>`}</ul>
    </article>`}).join("");

  $("cats").innerHTML=Object.entries(CATS).map(([k,v])=>{
    const all=ITEMS.filter(i=>i[1]===k), dn=all.filter(i=>done[i[0]]).length;
    return `<div class="cat"><div class="cat-row"><span>${v}</span><span>${dn}/${all.length} · ${pct(dn,all.length)}%</span></div><div class="bar"><i style="width:${pct(dn,all.length)}%"></i></div></div>`}).join("");

  const days=t=>Math.ceil((new Date(t+"T00:00:00")-new Date(today+"T00:00:00"))/864e5);
  $("countdown").innerHTML=[["Internship selesai","2026-10-26"],["ACLS PERKI","2026-11-10"],["Perkiraan pengumuman","2027-01-14"]]
    .map(([l,t])=>{const x=days(t);return `<div class="cd"><span>${l}<br><span class="small muted">${fmt(t)}</span></span><b>${x>0?x+" hari":x===0?"Hari ini":"Lewat"}</b></div>`}).join("");
}

$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;keep.clear();render()}});
$("hideDone").addEventListener("change",()=>{keep.clear();try{localStorage.setItem("sipss-hide",$("hideDone").checked?"1":"0")}catch(e){}render()});
$("phases").addEventListener("click",e=>{const h=e.target.closest("[data-p]");if(!h)return;
  collapsed[h.dataset.p]=!collapsed[h.dataset.p];try{localStorage.setItem("sipss-collapsed",JSON.stringify(collapsed))}catch(e){}render()});
$("phases").addEventListener("change",e=>{const id=e.target.dataset.id;if(!id)return;
  keep.add(id);if(e.target.checked)done[id]=todayISO();else delete done[id];render();queueSave()});

function setView(v){document.body.dataset.view=v;
  document.querySelectorAll("#tabs button").forEach(b=>b.dataset.v===v?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  keep.clear();if(cur)render();
  try{localStorage.setItem("sipss-view",v)}catch(e){}window.scrollTo(0,0)}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)setView(b.dataset.v)});
let v0="today";try{v0=localStorage.getItem("sipss-view")||"today"}catch(e){}
setView(v0);
$("day").addEventListener("click",e=>{const b=e.target.closest("[data-nav]");if(!b)return;
  cur=b.dataset.nav==="0"?todayISO():addDays(cur,+b.dataset.nav);keep.clear();render()});
$("day").addEventListener("change",e=>{
  if(e.target.id==="dayPick"){if(e.target.value){cur=e.target.value;keep.clear();render()}return}
  const k=e.target.dataset.day;if(!k)return;const id=k.slice(2),on=e.target.checked;keep.add(id);
  if(k[0]==="c"){if(on)done[id]=todayISO();else delete done[id]}else{if(on)daily[id]=true;else delete daily[id]}
  render();queueSave()});

// Saving: shared db doc (survives devices and is readable by Claude); localStorage is the offline fallback.
let ref=null, timer=null, chain=Promise.resolve(), dirty=false;
const status=(t,ok)=>{$("save").textContent=t;$("save").className="save"+(ok?" ok":"")};
function local(){try{localStorage.setItem("sipss-done",JSON.stringify(done));localStorage.setItem("sipss-daily",JSON.stringify(daily))}catch(e){}}
function queueSave(){dirty=true;local();status("Menyimpan…");clearTimeout(timer);timer=setTimeout(()=>{
  const body={done:{...done},daily:{...daily},updatedAt:new Date().toISOString()};
  if(!ref){dirty=false;status("Tersimpan",true);return}
  chain=chain.then(()=>ref.set(body)).then(()=>{dirty=false;status("Tersimpan",true)})
    .catch(()=>status("Gagal menyimpan ke cloud — tersimpan di perangkat ini"))},600)}

try{done=JSON.parse(localStorage.getItem("sipss-done")||"{}");daily=JSON.parse(localStorage.getItem("sipss-daily")||"{}")}catch(e){}
render();
(async()=>{
  const db=window.claude?await window.claude.use("db"):null;
  if(!db){status("Tersimpan di perangkat ini",true);return}
  ref=db.doc("progress/main");
  ref.onSnapshot(s=>{if(dirty)return;
    if(s.exists){const d=s.data(),nd=d.done||{},ny=d.daily||{};
      // skip the echo of our own save: re-rendering mid-tap is what moves rows on iPhone
      if(JSON.stringify(nd)!==JSON.stringify(done)||JSON.stringify(ny)!==JSON.stringify(daily)){done={...nd};daily={...ny};local();render()}
      status("Tersimpan",true)}
    else if(Object.keys(done).length||Object.keys(daily).length)queueSave(); // carry device-only ticks into the cloud once
    else status("Tersimpan",true)},
    ()=>status("Koneksi cloud terputus — tersimpan di perangkat ini"));
})();
</script>

<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
